[package]
name = "metafs"
version = "0.1.0"
edition = "2024"

[lints.clippy]
pedantic = { level = "warn", priority = -3 }
nursery = { level = "warn", priority = -2 }
unwrap_used = { level = "warn", priority = -1 }
cognitive_complexity = { level = "allow", priority = 0 }

[dependencies]
clap = { version = "4", features = ["derive"] }
dashmap = "6"
fuser = "0.18"
libc = "0.2"
log = "0.4"
nix = { version = "0.31", features = ["fs", "feature", "process", "term"] }
mimalloc = { version = "0.1.52", features = ["override"] }

[dev-dependencies]
tempfile = "3"
